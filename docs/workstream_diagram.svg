<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 510" width="1180" height="510" font-family="Arial, sans-serif">

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#555555"/>
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#cc0000"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1180" height="510" fill="#f9f9f9" rx="10"/>

  <!-- Title -->
  <text x="590" y="38" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">
    Patient Acquisition &amp; Growth Agent — Workstream Dependencies
  </text>

  <!-- ═══════════════════ BOXES ═══════════════════ -->

  <!-- WS-1: Discovery (x=40, y=130, w=210, h=105) -->
  <rect x="40" y="130" width="210" height="105" rx="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.8"/>
  <text x="145" y="158" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a3a5c">WS-1: Discovery &amp;</text>
  <text x="145" y="173" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a3a5c">Requirements</text>
  <text x="145" y="194" text-anchor="middle" font-size="10" fill="#444">Ajaia SA + Client Ops</text>
  <text x="145" y="210" text-anchor="middle" font-size="9" fill="#666" font-style="italic">Weeks 1–2</text>
  <text x="145" y="226" text-anchor="middle" font-size="9" fill="#666" font-style="italic">Output: Requirements doc, data dictionary</text>

  <!-- WS-2: Compliance (x=40, y=320, w=210, h=105) -->
  <rect x="40" y="320" width="210" height="105" rx="8" fill="#fff2cc" stroke="#d6b656" stroke-width="1.8"/>
  <text x="145" y="348" text-anchor="middle" font-size="11" font-weight="bold" fill="#5c4a00">WS-2: Compliance &amp;</text>
  <text x="145" y="363" text-anchor="middle" font-size="11" font-weight="bold" fill="#5c4a00">Privacy</text>
  <text x="145" y="384" text-anchor="middle" font-size="10" fill="#444">Ajaia Compliance + Client Legal</text>
  <text x="145" y="400" text-anchor="middle" font-size="9" fill="#666" font-style="italic">Weeks 2–3</text>
  <text x="145" y="416" text-anchor="middle" font-size="9" fill="#666" font-style="italic">Output: BAA, PHI data flow, consent design</text>

  <!-- WS-3: Integrations (x=345, y=130, w=210, h=105) -->
  <rect x="345" y="130" width="210" height="105" rx="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.8"/>
  <text x="450" y="158" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a3a5c">WS-3: Integrations &amp;</text>
  <text x="450" y="173" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a3a5c">Scheduling</text>
  <text x="450" y="194" text-anchor="middle" font-size="10" fill="#444">Ajaia Eng + Client IT</text>
  <text x="450" y="210" text-anchor="middle" font-size="9" fill="#666" font-style="italic">Weeks 3–5</text>
  <text x="450" y="226" text-anchor="middle" font-size="9" fill="#666" font-style="italic">Output: CRM sync, calendar API, SMS/email</text>

  <!-- WS-4: Conversation Design (x=345, y=320, w=210, h=105) -->
  <rect x="345" y="320" width="210" height="105" rx="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.8"/>
  <text x="450" y="348" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a3a5c">WS-4: Conversation</text>
  <text x="450" y="363" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a3a5c">Design &amp; Knowledge</text>
  <text x="450" y="384" text-anchor="middle" font-size="10" fill="#444">Ajaia AI + Client Clinical Ops</text>
  <text x="450" y="400" text-anchor="middle" font-size="9" fill="#666" font-style="italic">Weeks 3–4</text>
  <text x="450" y="416" text-anchor="middle" font-size="9" fill="#666" font-style="italic">Output: Flows, KB, escalation playbook</text>

  <!-- WS-5: QA (x=650, y=225, w=210, h=105) -->
  <rect x="650" y="225" width="210" height="105" rx="8" fill="#d5e8d4" stroke="#82b366" stroke-width="1.8"/>
  <text x="755" y="253" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a3c1a">WS-5: QA &amp; Pilot</text>
  <text x="755" y="268" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a3c1a">Readiness</text>
  <text x="755" y="289" text-anchor="middle" font-size="10" fill="#444">Ajaia QA + Client Ops</text>
  <text x="755" y="305" text-anchor="middle" font-size="9" fill="#666" font-style="italic">Weeks 5–6</text>
  <text x="755" y="321" text-anchor="middle" font-size="9" fill="#666" font-style="italic">Output: QA results, launch criteria</text>

  <!-- WS-6: Rollout (x=945, y=225, w=210, h=105) -->
  <rect x="945" y="225" width="210" height="105" rx="8" fill="#d5e8d4" stroke="#82b366" stroke-width="1.8"/>
  <text x="1050" y="253" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a3c1a">WS-6: Rollout &amp;</text>
  <text x="1050" y="268" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a3c1a">Monitoring</text>
  <text x="1050" y="289" text-anchor="middle" font-size="10" fill="#444">Ajaia Delivery + Client IT</text>
  <text x="1050" y="305" text-anchor="middle" font-size="9" fill="#666" font-style="italic">Weeks 7–8</text>
  <text x="1050" y="321" text-anchor="middle" font-size="9" fill="#666" font-style="italic">Output: Pilot go-live, perf dashboard</text>

  <!-- ═══════════════════ ARROWS ═══════════════════ -->

  <!-- 1. WS-1 → WS-3: horizontal at y=180 (scope + data dictionary) -->
  <path d="M 250 183 L 345 183" stroke="#555" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
  <text x="297" y="174" text-anchor="middle" font-size="9" fill="#555">scope + data</text>
  <text x="297" y="185" text-anchor="middle" font-size="9" fill="#555">dictionary</text>

  <!-- 2. WS-1 → WS-4: from WS-1 right-bottom, bend down (scope + patient journey) -->
  <path d="M 250 218 L 282 218 L 282 372 L 345 372" stroke="#555" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
  <text x="270" y="302" text-anchor="middle" font-size="9" fill="#555" transform="rotate(-90 270 302)">scope + patient journey</text>

  <!-- 3. WS-2 → WS-3: red dashed compliance gate (from WS-2 right, up and right to WS-3 left-bottom) -->
  <path d="M 250 360 L 308 360 L 308 212 L 345 212" stroke="#cc0000" stroke-width="1.6" stroke-dasharray="7,4" fill="none" marker-end="url(#arrow-red)"/>
  <text x="328" y="294" text-anchor="middle" font-size="9" fill="#cc0000" transform="rotate(-90 328 294)">compliance gate ⚠</text>

  <!-- 4. WS-3 → WS-5: from WS-3 right, bend to WS-5 left-top (integrations in staging) -->
  <path d="M 555 182 L 592 182 L 592 262 L 650 262" stroke="#555" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
  <text x="600" y="175" text-anchor="start" font-size="9" fill="#555">integrations in staging</text>

  <!-- 5. WS-4 → WS-5: from WS-4 right, bend up to WS-5 left-bottom (flows finalized) -->
  <path d="M 555 372 L 600 372 L 600 298 L 650 298" stroke="#555" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
  <text x="560" y="394" text-anchor="start" font-size="9" fill="#555">flows finalized</text>

  <!-- 6. WS-5 → WS-6: horizontal at y=278 (pilot readiness sign-off) -->
  <path d="M 860 278 L 945 278" stroke="#555" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
  <text x="902" y="270" text-anchor="middle" font-size="9" fill="#555">pilot readiness</text>
  <text x="902" y="281" text-anchor="middle" font-size="9" fill="#555">sign-off</text>

  <!-- ═══════════════════ LEGEND ═══════════════════ -->
  <rect x="40" y="458" width="1100" height="1" fill="#ccc"/>

  <rect x="40" y="470" width="15" height="15" rx="3" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1"/>
  <text x="62" y="482" font-size="10" fill="#444">Ajaia-led workstream</text>

  <rect x="230" y="470" width="15" height="15" rx="3" fill="#d5e8d4" stroke="#82b366" stroke-width="1"/>
  <text x="252" y="482" font-size="10" fill="#444">Joint delivery workstream</text>

  <rect x="450" y="470" width="15" height="15" rx="3" fill="#fff2cc" stroke="#d6b656" stroke-width="1"/>
  <text x="472" y="482" font-size="10" fill="#444">Compliance / Legal workstream</text>

  <line x1="700" y1="478" x2="735" y2="478" stroke="#cc0000" stroke-width="1.6" stroke-dasharray="7,4"/>
  <polygon points="733,474.5 743,478 733,481.5" fill="#cc0000"/>
  <text x="750" y="482" font-size="10" fill="#444">Hard compliance gate (blocks build)</text>

</svg>
